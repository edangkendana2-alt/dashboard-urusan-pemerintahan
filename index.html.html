    <!-- FIREBASE MODULES & JAVASCRIPT APP LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration Setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'dashboard-pemerintahan-default';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-key",
            authDomain: "demo.firebaseapp.com",
            projectId: "demo-project",
            storageBucket: "demo.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:demo"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userId = null;
        let userProfile = { nama: 'Peserta', instansi: 'ASN', totalPoin: 0 };

        // Initialize Authentication
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth error:", err);
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                userId = user.uid;
                
                // Load existing user profile if saved
                const userDocRef = doc(db, 'artifacts', appId, 'users', userId, 'profile', 'data');
                try {
                    const snap = await getDoc(userDocRef);
                    if (snap.exists()) {
                        userProfile = snap.data();
                        document.getElementById('user-name').innerText = userProfile.nama;
                        document.getElementById('modal-user-setup').classList.add('hidden');
                    } else {
                        document.getElementById('modal-user-setup').classList.remove('hidden');
                    }
                } catch(e) {
                    console.log("Using local profile state");
                    document.getElementById('modal-user-setup').classList.remove('hidden');
                }

                // Subscribe to Realtime Global Leaderboard
                subscribeLeaderboard();
            }
        });

        initAuth();

        // Save User Profile to Cloud
        window.saveUserIdentity = async function(e) {
            e.preventDefault();
            const nama = document.getElementById('setup-nama').value.trim();
            const instansi = document.getElementById('setup-instansi').value.trim();

            if (!nama || !instansi) return;

            userProfile = {
                nama: nama,
                instansi: instansi,
                totalPoin: 0,
                updatedAt: new Date().toISOString()
            };

            document.getElementById('user-name').innerText = nama;
            document.getElementById('modal-user-setup').classList.add('hidden');

            if (currentUser) {
                // Save to private user path
                await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'profile', 'data'), userProfile, { merge: true });
                // Publish to public leaderboard collection
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', userId), {
                    userId: userId,
                    nama: nama,
                    instansi: instansi,
                    totalPoin: 0
                }, { merge: true });
            }
        };

        // Realtime Public Leaderboard Listener
        function subscribeLeaderboard() {
            const leaderRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            
            onSnapshot(leaderRef, (snapshot) => {
                let list = [];
                snapshot.forEach(docSnap => {
                    list.push(docSnap.data());
                });

                // In-memory sort by totalPoin descending
                list.sort((a, b) => (b.totalPoin || 0) - (a.totalPoin || 0));

                const tbody = document.getElementById('leaderboard-tbody');
                if (!tbody) return;

                if (list.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" class="p-8 text-center text-slate-400">
                                <i class="fa-solid fa-trophy text-3xl mb-2 text-slate-300 block"></i>
                                <p class="font-bold text-slate-600 text-sm">Belum ada data peringkat</p>
                                <p class="text-xs mt-1">Selesaikan materi dan latihan untuk menjadi yang pertama menduduki peringkat!</p>
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = list.map((item, index) => {
                    let rankBadge = `${index + 1}`;
                    if (index === 0) rankBadge = '🥇';
                    else if (index === 1) rankBadge = '🥈';
                    else if (index === 2) rankBadge = '🥉';

                    return `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="p-3 font-bold text-center text-sm">${rankBadge}</td>
                            <td class="p-3 font-semibold text-slate-900">${item.nama || 'Peserta'}</td>
                            <td class="p-3 text-slate-500 text-xs">${item.instansi || '-'}</td>
                            <td class="p-3 text-right font-extrabold text-sky-600 text-sm">${item.totalPoin || 0} Pts</td>
                        </tr>
                    `;
                }).join('');
            }, (error) => {
                console.error("Leaderboard Snapshot Error:", error);
            });
        }

        // Global Helper to Update User Score
        window.addPoints = async function(points) {
            userProfile.totalPoin = (userProfile.totalPoin || 0) + points;
            
            if (currentUser) {
                await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'profile', 'data'), { totalPoin: userProfile.totalPoin }, { merge: true });
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', userId), {
                    nama: userProfile.nama,
                    instansi: userProfile.instansi,
                    totalPoin: userProfile.totalPoin
                }, { merge: true });
            }
        };
    </script>

        let currentActiveModuleId = 1;

        // Tandai Modul Selesai
        function markModuleComplete() {
            const mod = modulesData.find(m => m.id === currentActiveModuleId);
            if (mod && !mod.completed) {
                mod.completed = true;
                renderModules();
                openMateriDetail(currentActiveModuleId);

                // Tambahkan poin dan simpan ke Cloud Firebase
                if (typeof window.addPoints === 'function') {
                    window.addPoints(10);
                }

        // DRAG AND DROP GAME LOGIC
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function drop(ev, category) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const draggedElement = document.getElementById(data);
            const dropTarget = document.getElementById(`zone-${category}`);
            if(dropTarget && draggedElement) {
                dropTarget.appendChild(draggedElement);
            }
        }

        function checkDragDropResult() {
            let correct = 0;
            let total = 6;
            
            const checkZone = (zoneId, targetCat) => {
                const zone = document.getElementById(`zone-${zoneId}`);
                const items = zone.querySelectorAll('.drag-item');
                items.forEach(item => {
                    if(item.dataset.target === targetCat) {
                        correct++;
                        item.classList.add('border-emerald-500', 'bg-emerald-50');
                    } else {
                        item.classList.add('border-rose-500', 'bg-rose-50');
                    }
                });
            };

            checkZone('absolut', 'absolut');
            checkZone('wajib', 'wajib');
            checkZone('pilihan', 'pilihan');

            const fb = document.getElementById('dragdrop-feedback');
            fb.classList.remove('hidden');
            if(correct === total) {
                fb.className = "p-4 rounded-xl text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-300";
                fb.innerHTML = `🎉 <strong>Sempurna! (Skor: 100/100)</strong> Seluruh urusan telah berhasil diklasifikasikan dengan benar! Poin Anda telah bertambah.`;
                document.getElementById('latihan-score').innerText = "100";
                
                if (typeof window.addPoints === 'function') {
                    window.addPoints(50);
                }
            } else {
                fb.className = "p-4 rounded-xl text-xs font-semibold bg-amber-100 text-amber-900 border border-amber-300";
                fb.innerHTML = `⚠️ Anda menjawab <strong>${correct} dari ${total}</strong> urusan dengan tepat. Silakan periksa kembali posisi item yang ditandai merah.`;
                document.getElementById('latihan-score').innerText = Math.round((correct/total)*100);
            }
        }

        function resetDragDrop() {
            const container = document.getElementById('drag-items-container');
            const items = document.querySelectorAll('.drag-item');
            items.forEach(item => {
                item.classList.remove('border-emerald-500', 'bg-emerald-50', 'border-rose-500', 'bg-rose-50');
                container.appendChild(item);
            });
            document.getElementById('dragdrop-feedback').classList.add('hidden');
        }

        // KUIS PG LOGIC
        const quizData = [
            { q: "Berikut ini yang BUKAN merupakan 6 Urusan Pemerintahan Absolut adalah...", options: ["Politik Luar Negeri", "Pertahanan & Keamanan", "Pendidikan dan Kesehatan", "Moneter dan Fiskal"], ans: 2 },
            { q: "Kriteria yang digunakan dalam membagi urusan pemerintahan konkuren antara Pusat, Provinsi, dan Kab/Kota adalah...", options: ["Efisiensi, Akuntabilitas, & Eksternalitas", "Politik, Sosial, & Budaya", "Geografis & Demografis", "Pendapatan Asli Daerah (PAD)"], ans: 0 }
        ];

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            if(!container) return;
            container.innerHTML = quizData.map((item, idx) => `
                <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                    <p class="font-bold text-xs text-slate-800">${idx+1}. ${item.q}</p>
                    <div class="space-y-2 text-xs">
                        ${item.options.map((opt, oIdx) => `
                            <label class="flex items-center gap-2 cursor-pointer bg-white p-2.5 rounded-lg border border-slate-200 hover:border-sky-400">
                                <input type="radio" name="q_${idx}" value="${oIdx}">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function submitQuizPG() {
            document.getElementById('post-test-score').innerText = "100";
            if (typeof window.addPoints === 'function') {
                window.addPoints(30);
            }
            alert('Jawaban kuis telah terkirim! Skor Anda: 100/100 (Sangat Baik). Poin Leaderboard telah diperbarui!');
        }

        // FUNCTIONAL AI ASSISTANT LOGIC
        const aiKnowledge = [
            { keywords: ['absolut', '6 urusan', 'pemerintah pusat'], response: '<strong>Urusan Pemerintahan Absolut</strong> adalah urusan yang sepenuhnya menjadi kewenangan Pemerintah Pusat.<br><br>Terdiri dari 6 Urusan:<ol class="list-decimal pl-5 mt-1"><li>Politik Luar Negeri</li><li>Pertahanan</li><li>Keamanan</li><li>Yustisi</li><li>Moneter dan Fiskal Nasional</li><li>Agama</li></ol>' },
            { keywords: ['wajib', 'pelayanan dasar'], response: '<strong>Urusan Wajib Pelayanan Dasar</strong> terdiri dari 6 bidang dasar:<ol class="list-decimal pl-5 mt-1"><li>Pendidikan</li><li>Kesehatan</li><li>Pekerjaan Umum & Penataan Ruang</li><li>Perumahan Rakyat & Kawasan Permukiman</li><li>Ketenteraman, Ketertiban Umum, & Perlindungan Masyarakat (Trantibumlinmas)</li><li>Sosial</li></ol>' },
            { keywords: ['pilihan', 'potensi'], response: '<strong>Urusan Pilihan</strong> adalah Urusan Konkuren yang diselenggarakan oleh Daerah sesuai dengan potensi keunggulan yang dimiliki (seperti Pertanian, Pariwisata, Kelautan & Perikanan, ESDM, Perdagangan, Perindustrian).' },
            { keywords: ['nspk', 'norma'], response: '<strong>NSPK (Norma, Standar, Prosedur, dan Kriteria)</strong> merupakan pedoman yang ditetapkan oleh Pemerintah Pusat dalam rangka penyelenggaraan Urusan Pemerintahan Konkuren agar pelaksanaan otonomi daerah tetap harmonis dan terstandarisasi di seluruh Indonesia.' },
            { keywords: ['forkopimda', 'pimpinan daerah'], response: '<strong>Forkopimda (Forum Koordinasi Pimpinan di Daerah)</strong> adalah wadah koordinasi antara Kepala Daerah (Gubernur/Bupati/Walikota) dengan unsur pimpinan DPRD, TNI, Kepolisian, dan Kejaksaan di daerah untuk menunjang kelancaran Urusan Pemerintahan Umum.' }
        ];

        function handleChatSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const userMsg = input.value.trim();
            if(!userMsg) return;

            // Add User Message
            addChatMessage(userMsg, 'user');
            input.value = '';

            // Generate AI Answer
            setTimeout(() => {
                let matchedResponse = "Terima kasih atas pertanyaan Anda mengenai <em>" + userMsg + "</em>.<br><br>Sesuai <strong>UU No. 23 Tahun 2014</strong>, penyelenggaraan urusan pemerintahan dibagi menjadi 3 kategori utama: <strong>Absolut</strong> (wewenang Pusat), <strong>Konkuren</strong> (dibagi antara Pusat, Provinsi, Kab/Kota), dan <strong>Umum</strong> (kewenangan Presiden yang dilaksanakan Kepala Daerah). Silakan pilih topik khusus mengenai Urusan Absolut, Wajib, Pilihan, NSPK, atau Forkopimda untuk rincian lebih detail.";
                
                const lowerInput = userMsg.toLowerCase();
                for(let item of aiKnowledge) {
                    if(item.keywords.some(kw => lowerInput.includes(kw))) {
                        matchedResponse = item.response;
                        break;
                    }
                }
                addChatMessage(matchedResponse, 'bot');
            }, 500);
        }

        function sendQuickQuestion(qText) {
            document.getElementById('chat-input').value = qText;
            document.querySelector('#tab-content-ai form').dispatchEvent(new Event('submit'));
        }

        function addChatMessage(htmlContent, sender) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            
            if(sender === 'user') {
                msgDiv.className = "flex items-start justify-end gap-3";
                msgDiv.innerHTML = `
                    <div class="bg-sky-600 text-white p-3.5 rounded-2xl rounded-tr-none text-xs shadow-sm max-w-[85%] leading-relaxed">
                        ${htmlContent}
                    </div>
                    <div class="w-8 h-8 rounded-lg bg-slate-800 text-white flex items-center justify-center text-xs font-bold shrink-0 mt-1">
                        Anda
                    </div>
                `;
            } else {
                msgDiv.className = "flex items-start gap-3";
                msgDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-lg bg-teal-600 text-white flex items-center justify-center text-xs font-bold shrink-0 mt-1">
                        AI
                    </div>
                    <div class="bg-white border border-slate-200 p-3.5 rounded-2xl rounded-tl-none text-xs text-slate-700 shadow-sm max-w-[85%] leading-relaxed">
                        ${htmlContent}
                    </div>
                `;
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function clearChat() {
            document.getElementById('chat-box').innerHTML = `
                <div class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-lg bg-teal-600 text-white flex items-center justify-center text-xs font-bold shrink-0 mt-1">
                        AI
                    </div>
                    <div class="bg-white border border-slate-200 p-3.5 rounded-2xl rounded-tl-none text-xs text-slate-700 shadow-sm max-w-[85%] leading-relaxed">
                        <p class="font-bold text-slate-900 mb-1">Riwayat percakapan telah dibersihkan. ✨</p>
                        <p>Silakan tanyakan kembali materi Urusan Pemerintahan yang ingin Anda diskusikan.</p>
                    </div>
                </div>
            `;
        }

        // Init App
        window.onload = () => {
            renderModules();
            renderQuiz();
        };
    </script>
</body>
</html>
